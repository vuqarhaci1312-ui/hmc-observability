[project]
name = "hmc-observability"
version = "1.0.0"
description = "HMC Observability Control Center backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.3",
  "alembic>=1.14.0",
  "redis>=5.2.1",
  "pyjwt>=2.10.1",
  "argon2-cffi>=23.1.0",
  "httpx>=0.28.1",
  "prometheus-client>=0.21.1",
  "orjson>=3.10.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
