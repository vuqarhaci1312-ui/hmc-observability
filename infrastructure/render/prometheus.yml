global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: hmc-observability

rule_files:
  - /opt/render/alerts.yml

scrape_configs:
  - job_name: hmc-api
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          service: api

  - job_name: hmc-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8001"]
        labels:
          service: worker

  - job_name: hmc-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8002"]
        labels:
          service: scheduler

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
