groups:
  - name: hmc-platform
    rules:
      - alert: HmcApiDown
        expr: up{job="hmc-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: HMC API scrape target is down
      - alert: HmcHighApiErrorRate
        expr: sum(rate(hmc_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(hmc_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: HMC API 5xx ratio is above 5%
      - alert: HmcIngestionLag
        expr: hmc_ingestion_lag_seconds > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Telemetry ingestion lag is above 30 seconds
