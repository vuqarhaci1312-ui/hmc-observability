worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 8m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream hmc_api {
        server api:8000;
    }

    upstream hmc_frontend {
        server frontend:80;
    }

    upstream hmc_grafana {
        server grafana:3000;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-XSS-Protection "0" always;

        location /api/ {
            proxy_pass http://hmc_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location /health/ {
            proxy_pass http://hmc_api;
            proxy_set_header Host $host;
        }

        location /docs {
            proxy_pass http://hmc_api;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://hmc_api;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://hmc_api;
            proxy_set_header Host $host;
        }

        location = /_grafana_auth {
            internal;
            proxy_pass http://hmc_api/api/v1/auth/grafana;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
        }

        location /grafana/ {
            auth_request /_grafana_auth;
            auth_request_set $hmc_grafana_user $upstream_http_x_auth_user;
            auth_request_set $hmc_grafana_org $upstream_http_x_auth_org;
            proxy_pass http://hmc_grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-WEBAUTH-USER $hmc_grafana_user;
            proxy_set_header X-Grafana-Org-Id $hmc_grafana_org;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            proxy_pass http://hmc_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
